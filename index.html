<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>inicio-de-sesion-tpro</title>

    <link rel="stylesheet" href="stylus.css">
</head>

<body>
    <header>
        <h1 id= "titulo_pagina">INICIO DE SESION</h1>
        <p id="subtitulo">Por favor, ingrese los datos que se le solicitan</p>
    </header>

    <main>

        <!-- Aqui va el ingreso del nombre y la contraseña -->
         <section class="datos_sesion_nombre">
            <h2>Ingrese nombre</h2>

            <label for="nombre">Nombre</label>
            <input
            type="text"
            id="nombre"
            placeholder="Escriba su nombre de usuario."
            >

            <h2>Ingrese su contraseña</h2>
            <label for="contraseña">Contraseña</label>
            <input
            type="text"
            id="contraseña"
            placeholder="Escriba su contraseña."
            >

            <button id="btn-ingresar">Ingresar Datos</button>
            <p id="datos-registrados"></p>
         </section>
    </main>
</body>
